trigger:
  branches:
    include:
      # - main
      # - feature/*
      - none

pool: Default

parameters:
  - name: tflint
    displayName: Run TFLint
    type: boolean
    default: true

  - name: tfsec
    displayName: Run tfsec
    type: boolean
    default: true

  - name: checkov
    displayName: Run Checkov
    type: boolean
    default: true

  - name: terraform_validate
    displayName: Run terraform validate
    type: boolean
    default: true

  - name: approval
    displayName: Run approval
    type: boolean
    default: true

  - name: apply
    displayName: Run apply
    type: boolean
    default: true

stages:
  - stage: TFLint
    displayName: TFLint
    condition: ${{ parameters.tflint }}
    dependsOn: []

    jobs:
      - job: TFLint
        displayName: Run TFLint

        steps:
          - task: PowerShell@2
            displayName: Run TFLint
            inputs:
              targetType: inline
              script: |

                Write-Host "Current Directory:"
                pwd

                tflint --init
                tflint --recursive

  - stage: TFSEC
    displayName: tfsec
    condition: ${{ parameters.tfsec }}
    dependsOn: []

    jobs:
      - job: TFSEC
        displayName: Run tfsec

        steps:
          - task: PowerShell@2
            displayName: Run tfsec
            inputs:
              targetType: inline
              script: |
                tfsec .

  - stage: Checkov
    displayName: Checkov
    condition: ${{ parameters.checkov }}
    dependsOn: []

    jobs:
      - job: Checkov
        displayName: Run Checkov

        steps:
          - task: PowerShell@2
            displayName: Run Checkov
            inputs:
              targetType: inline
              script: |
                checkov -d . --framework terraform
  - stage: terraform_validate
    condition: ${{ parameters.terraform_validate }}
    displayName: terraform validate
    jobs:
      - job: 
        displayName: terraform_init_validate_plan
        steps:
        - task: TerraformTask@5
          displayName: terraform init
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'ericsson'
            backendAzureRmResourceGroupName: 'sohit-rg'
            backendAzureRmStorageAccountName: 'sohittfstate001'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'sohit.terraform.tfstate'''
        - task: TerraformTask@5
          displayName: validate
          inputs:
            provider: 'azurerm'
            command: 'validate'
        - task: TerraformTask@5
          displayName: plan
          inputs:
            provider: 'azurerm'
            command: 'plan'

  - stage: approval
    condition: ${{ parameters.approval }}
    displayName: approval
    pool: server
    jobs:
      - job: 
        displayName: approval
        steps:
        - task: ManualValidation@1
          displayName: approval
          inputs:
            notifyUsers: 'sohitg89@gmail.com'
            approvers: 'sohitg89@gmail.com'
            instructions: 'Please check and approve'

  - stage: apply
    condition: ${{ parameters.apply }}
    displayName: apply
    dependsOn: approval
    jobs:
      - job: 
        displayName: terraform init
        steps:
        - task: TerraformTask@5
          displayName: terraform init
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'ericsson'
            backendAzureRmResourceGroupName: 'sohit-rg'
            backendAzureRmStorageAccountName: 'sohittfstate001'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'sohit.terraform.tfstate'''
        - task: TerraformTask@5
          displayName: apply
          inputs:
            provider: 'azurerm'
            command: 'apply'
            
    

  