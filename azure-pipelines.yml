pool: Default

trigger:
-  main
- feature/*

stages:
  - stage: tflint
    displayName: tflint
    jobs:
      - job: tflint
        steps:
        - task: PowerShell@2
          displayName: tflint
          inputs:
            targetType: 'inline'
            script: 'tflint --recursive'

  - stage: tfsec
    displayName: tfsec
    jobs:
      - job: tfsec
        steps:
        - task: PowerShell@2
          displayName: sec
          inputs:
            targetType: 'inline'
            script: 'tfsec .'